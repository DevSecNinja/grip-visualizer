---
name: Links

on:
  pull_request:
    paths:
      - "**.md"
      - "src/data/grip.json"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  schedule:
    # Weekly, Mondays at 06:00 UTC — catches link rot over time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Config (accept codes, excludes, retries) lives in lychee.toml.
          # Inputs: Markdown docs + the mapping data URLs (docsUrl/sourceUrl).
          args: >-
            --config lychee.toml
            --no-progress
            './**/*.md'
            'src/data/grip.json'
          # Fail the job on broken links for PRs and manual runs. On the
          # scheduled run we don't fail; instead we open/append an issue below.
          fail: ${{ github.event_name != 'schedule' }}
          jobSummary: true

      - name: Open issue on scheduled link rot
        if: ${{ github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          # gh issue create fails on a missing label, so create them first.
          for label in broken-links automated; do
            gh label create "${label}" >/dev/null 2>&1 || true
          done
          gh issue create --title "Broken links detected by the scheduled link checker" \
            --body-file ./lychee/out.md --label broken-links --label automated
